[package]
name = "memorycore-castle"
version = "0.2.5"
description = "MemoryCore Castle - a full-screen desktop for your MemoryCore companion"
authors = ["Kiyo Software TechLab"]
license = "MIT"
edition = "2021"

[lib]
name = "memorycore_castle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# official release builds only (scripts/release.ps1): the signed self-updater
official = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["windows-native"] }
portable-pty = "0.9"
base64 = "0.22"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
arboard = "3.7"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-updater = { version = "2", optional = true }
# the browser sign-in (PKCE): a random secret and its SHA-256 fingerprint
sha2 = "0.10"
getrandom = "0.3"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }

[target.'cfg(windows)'.dependencies]
# the world windows ask which window is on top at a few points, to rest when covered
# (and the CPU gauge reads processor time with GetSystemTimes, from Threading)
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
