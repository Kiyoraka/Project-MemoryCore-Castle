[package]
name = "memorycore-castle"
version = "0.3.0"
description = "MemoryCore Castle - a full-screen desktop for your MemoryCore companion"
authors = ["Kiyo Software TechLab"]
license = "MIT"
edition = "2021"

[lib]
name = "memorycore_castle_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# official release builds only (scripts/release.ps1): the signed self-updater
official = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
portable-pty = "0.9"
base64 = "0.22"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
arboard = "3.7"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# macOS Node comes as a .tar.gz (both are already built for other crates; plain dependencies so the tests run on every system)
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-updater = { version = "2", optional = true }
# the browser sign-in (PKCE): a random secret and its SHA-256 fingerprint
sha2 = "0.10"
getrandom = "0.3"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
trash = "5"
# the Discord bridge's Gateway connection (its REST calls stay on reqwest, same as every other bridge)
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
# the chat alert's toast is built here (not through the notification plugin) so a click on it can
# bring Castle forward and open CHAT, also from the Action Center; same version the plugin uses
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
# the world windows ask which window is on top at a few points, to rest when covered
# (and the CPU gauge reads processor time with GetSystemTimes, from Threading; DEV's live servers
# read the listening ports from IP Helper)
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Media_Audio", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_Security"] }
