# Every push to main and every pull request runs the tests on Windows and macOS, so a broken main shows before a release.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Castle ships for Windows and macOS: every change is checked on both
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:platform
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: node src-tauri/resources/tools/test-helpers.mjs
      # the WORLDSMITH memory helper is its own crate and Windows only
      - if: runner.os == 'Windows'
        run: cargo test --manifest-path worldsmith-helper/Cargo.toml
